name: ShellCheck

on:
  push:
    branches: [main, master]
    paths:
      - "**.sh"
      - "**/.lib.sh"
      - "**/.bashrc"
      - "**/.sl-*"
  pull_request:
    branches: [main, master]
    paths:
      - "**.sh"
      - "**/.lib.sh"
      - "**/.bashrc"
      - "**/.sl-*"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find shell scripts
        id: find-scripts
        run: |
          # Find all files with a bash shebang on line 1
          scripts=$(grep -rlP '^#!.*/(ba)?sh\b' --include='*' . | grep -v './.git/' | sort)
          echo "Found $(echo "$scripts" | wc -l) shell scripts"
          echo "$scripts"
          # Save to file for the matrix/runner
          echo "$scripts" > /tmp/scripts.txt

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          format: tty
          severity: warning
          check_together: 'yes'
